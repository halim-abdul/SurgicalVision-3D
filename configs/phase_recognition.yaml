task: phase_recognition
seed: 11711
clip_length: 16
image_size: [224, 224]
num_phases: 7
model:
  feature_dim: 256
  hidden_dim: 192
training:
  batch_size: 4
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
evaluation:
  metrics: [accuracy, balanced_accuracy, macro_f1, transition_rate]
