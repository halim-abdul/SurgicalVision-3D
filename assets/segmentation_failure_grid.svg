<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><style>text{font:16px Arial}.p{fill:#fafafa;stroke:#222;stroke-width:2}.bad{fill:none;stroke:#555;stroke-width:6}.mask{fill:#aaa;opacity:.55}</style><text x="30" y="30">Segmentation failure situations (schematic)</text><g transform="translate(30,60)"><rect class="p" width="190" height="230"/><text x="50" y="25">Occlusion</text><path class="mask" d="M25 160 Q90 60 165 160 L155 205 L35 205Z"/><rect x="82" y="55" width="30" height="170" fill="#777"/></g><g transform="translate(250,60)"><rect class="p" width="190" height="230"/><text x="55" y="25">Motion blur</text><path class="bad" d="M25 170 L165 90 M20 185 L160 105 M30 200 L170 120"/></g><g transform="translate(470,60)"><rect class="p" width="190" height="230"/><text x="45" y="25">Specular glare</text><circle cx="105" cy="125" r="50" fill="#ddd"/><circle cx="105" cy="125" r="25" fill="#fff" stroke="#bbb"/></g><g transform="translate(690,60)"><rect class="p" width="180" height="230"/><text x="43" y="25">Tiny target</text><circle cx="90" cy="130" r="10" fill="#777"/></g></svg>