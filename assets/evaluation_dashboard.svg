<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><style>text{font:16px Arial}.p{fill:#fafafa;stroke:#222;stroke-width:2}.line{fill:none;stroke:#555;stroke-width:3}</style><text x="30" y="35">Research evaluation dashboard (schematic)</text><rect class="p" x="30" y="65" width="280" height="140" rx="10"/><text x="55" y="95">Classification</text><path class="line" d="M55 170 L100 130 L145 145 L190 105 L255 115"/><rect class="p" x="360" y="65" width="280" height="140" rx="10"/><text x="385" y="95">Calibration</text><line class="line" x1="390" y1="180" x2="610" y2="100"/><path class="line" d="M390 175 L440 165 L490 142 L540 130 L610 112"/><rect class="p" x="690" y="65" width="280" height="140" rx="10"/><text x="715" y="95">Geometry error</text><path class="line" d="M715 115 L760 125 L810 150 L855 145 L920 175"/><rect class="p" x="30" y="245" width="940" height="130" rx="10"/><text x="55" y="280">Robustness strata</text><text x="55" y="315">clean • blur • smoke • glare • band dropout • calibration drift • depth holes • domain shift</text><text x="55" y="350">Report mean + confidence interval + failure routing, not a single headline metric.</text></svg>